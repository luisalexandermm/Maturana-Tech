<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./assets/logos/logo m.png" type="image/png" />
  <title>Maturana Tech</title>
  <meta name="description" content="Maturana Tech crea páginas web profesionales, claras y orientadas a convertir visitantes en clientes." />
  
  <!-- Fonts Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'white': '#ffffff',
            'pearl': '#F7F7F5',
            'pearl2': '#F0F0EE',
            'ink': '#1F2937',
            'ink2': '#111827',
            'slate': '#6B7280',
            'slate2': '#9CA3AF',
            'border': '#E5E5E3',
            'border2': '#D1D5DB',
            'teal': '#0F766E',
            'teal-dim': '#F0FAFA',
            'teal-mid': '#CCECEB',
            'teal-dark': '#0D6B64',
            'gold': '#C2A878',
            'gold-dim': '#FBF7F0',
            'gold-mid': '#E8D8BC',
          },
          fontFamily: {
            'display': ['Sora', 'sans-serif'],
            'body': ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'xs': '0 1px 4px rgba(0,0,0,.04)',
            'sm': '0 2px 12px rgba(0,0,0,.06)',
            'md': '0 6px 28px rgba(0,0,0,.08)',
            'lg': '0 16px 56px rgba(0,0,0,.10)',
            'teal': '0 8px 32px rgba(15, 118, 110, .20)',
            'gold': '0 4px 20px rgba(194, 168, 120, .25)',
          },
          keyframes: {
            floatY: {
              '0%': { transform: 'translateY(0)' },
              '100%': { transform: 'translateY(-12px)' }
            },
            pulseRing: {
              '0%, 100%': { opacity: '1', transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(15, 118, 110, .4)' },
              '50%': { opacity: '.7', transform: 'scale(.85)', boxShadow: '0 0 0 5px rgba(15, 118, 110, 0)' }
            },
            spin: {
              'to': { transform: 'rotate(360deg)' }
            },
            fadeUp: {
              'from': { opacity: '0', transform: 'translateY(20px)' },
              'to': { opacity: '1', transform: 'none' }
            },
            livePulse: {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(22, 163, 74, .4)' },
              '50%': { boxShadow: '0 0 0 5px rgba(22, 163, 74, 0)' }
            }
          },
          animation: {
            floatY: 'floatY 6s ease-in-out infinite alternate',
            pulseRing: 'pulseRing 2s ease-in-out infinite',
            spin: 'spin 20s linear infinite',
            fadeUp: 'fadeUp .7s cubic-bezier(.22,1,.36,1) both',
            livePulse: 'livePulse 1.5s ease-in-out infinite',
          }
        }
      }
    }
  </script>
  <script>
    try {
      if (localStorage.getItem('modoOscuro') === 'true') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {
      console.warn('No se pudo leer modoOscuro de localStorage', e);
    }
  </script>

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="./css/estilos.css" />
  
  <style>
    html { scroll-behavior: smooth; font-size: 16px; }
    html, body { overflow-x: hidden; }
    body { overflow-y: auto; }
    * { -webkit-font-smoothing: antialiased; }
    ::selection { background: #CCECEB; color: #0F766E; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #F7F7F5; }
    ::-webkit-scrollbar-thumb { background: #CCECEB; border-radius: 2px; }
  </style>
</head>
<body class="bg-white text-ink font-body">

  <!-- React Root -->
  <div id="root"></div>
  
  <!-- React y ReactDOM locales -->
  <script src="js/libs/react.production.min.js"></script>
  <script src="js/libs/react-dom.production.min.js"></script>
  <script src="js/libs/babel.min.js"></script>

  <!-- Componentes fuente con Babel -->
  <script type="text/babel" src="js/componentes/Encabezado.js"></script>
  <script type="text/babel" src="js/componentes/Hero.js"></script>
  <script type="text/babel" src="js/componentes/Estadisticas.js"></script>
  <script type="text/babel" src="js/componentes/Proyectos.js"></script>
  <script type="text/babel" src="js/componentes/Servicios.js"></script>
  <script type="text/babel" src="js/componentes/SobreMi.js"></script>
  <script type="text/babel" src="js/componentes/CtaBand.js"></script>
  <script type="text/babel" src="js/componentes/Contacto.js"></script>
  <script type="text/babel" src="js/componentes/Footer.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
